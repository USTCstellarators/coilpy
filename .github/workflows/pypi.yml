name: Release to PyPI

on:
  pull_request:
    types:
      - closed
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_type:
        description: Version component to bump before publishing
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump_version:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump project version
        id: bump
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        run: |
          version=$(python scripts/bump_version.py --part "${RELEASE_TYPE}")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coilpy/__init__.py meson.build
          git commit -m "chore: bump version to ${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master --follow-tags

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: bump_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.tag }}

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      # - name: Install Rtools (Windows)
      # # Rtools provides pkg-config on Windows
      #   if: ${{ runner.os == 'Windows' }}
      #   run: |
      #     choco install rtools -y --no-progress --force --version=4.0.0.20220206
      #     echo "c:\rtools40\ucrt64\bin;" >> $env:GITHUB_PATH

      - name: Use Fortran compiler on macos
        if: ${{ runner.os == 'macos' }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: 'gcc'
          version: 13

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.20.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          CIBW_ENVIRONMENT: "MACOSX_DEPLOYMENT_TARGET='12.0'"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    needs: bump_version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.bump_version.outputs.tag }}
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        submodules: true  # Optional, use if you have submodules

    - name: Install build frontend
      run: python -m pip install build

    - name: Build SDist
      run: python -m build --sdist

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: dist/*.tar.gz          

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [bump_version, build_wheels, make_sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/coilpy
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    # retrieve your distributions here
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
